<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Halem Farm - ระบบสั่งซื้อผักออร์แกนิคออนไลน์">
  <meta name="keywords" content="ผักออร์แกนิค, ฟาร์ม, สั่งซื้อออนไลน์, ผักสด">
  <meta name="author" content="Halem Farm">

  <title>Halem Farm - ระบบสั่งซื้อผักออร์แกนิค</title>
  <link rel="icon" href="logo.png" type="image/png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet" crossorigin="anonymous">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Kanit', 'sans-serif'] },
          boxShadow: {
            float: '0 6px 24px -8px rgba(15, 23, 42, 0.12)',
            'float-lg': '0 12px 32px -10px rgba(15, 23, 42, 0.25)'
          }
        }
      }
    };
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body class="bg-stone-100 font-sans font-light text-gray-800 antialiased">
  <div id="toast-success" class="hidden fixed inset-0 flex items-center justify-center z-50 px-6">
    <div class="bg-white shadow-float-lg rounded-3xl px-8 py-6 flex flex-col items-center animate-fade-in-out">
      <div class="w-14 h-14 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-3">
        <i data-lucide="check" class="w-7 h-7"></i>
      </div>
      <p class="text-gray-800 text-base text-center">
        สั่งซื้อสำเร็จ<br/><span class="text-sm text-gray-500">ทางฟาร์มได้รับคำสั่งซื้อเรียบร้อยแล้ว</span>
      </p>
    </div>
  </div>

  <div id="toast-error" class="hidden fixed inset-0 flex items-center justify-center z-50 px-6">
    <div class="bg-white shadow-float-lg rounded-3xl px-8 py-6 flex flex-col items-center animate-fade-in-out">
      <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mb-3">
        <i data-lucide="x" class="w-7 h-7"></i>
      </div>
      <p class="text-gray-800 text-base text-center">
        เกิดข้อผิดพลาด<br/><span id="toast-error-message" class="text-sm text-gray-500">กรุณาติดต่อผู้ดูแลระบบ ขออภัยในความไม่สะดวก</span>
      </p>
    </div>
  </div>

  <!-- Main Application Container -->
  <main class="min-h-screen">
    <div id="form-container" class="flex items-center justify-center py-8">
      <div class="animate-pulse text-gray-500">กำลังโหลดระบบ...</div>
    </div>
  </main>

  <!-- Scripts -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.542.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
  <script src="config.js?v=4"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
