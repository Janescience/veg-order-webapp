<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Halem Farm - ระบบสั่งซื้อผักออร์แกนิคออนไลน์">
  <meta name="keywords" content="ผักออร์แกนิค, ฟาร์ม, สั่งซื้อออนไลน์, ผักสด">
  <meta name="author" content="Halem Farm">

  <title>Halem Farm - ระบบสั่งซื้อผักออร์แกนิค</title>
  <link rel="icon" href="logo.png" type="image/png">

  <!-- Fonts (self-hosted Kanit) -->
  <link rel="preload" href="fonts/kanit-400-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css?v=7">

  <!-- Styles (tailwind.css is prebuilt: npm run build:css) -->
  <link rel="stylesheet" href="tailwind.css?v=7" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body class="bg-stone-100 font-sans font-light text-gray-800 antialiased">
  <div id="toast-success" class="hidden fixed inset-0 flex items-center justify-center z-50 px-6">
    <div class="bg-white shadow-float-lg rounded-3xl px-8 py-6 flex flex-col items-center animate-fade-in-out">
      <div class="w-14 h-14 rounded-full bg-green-50 text-green-600 flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p class="text-gray-800 text-base text-center">
        สั่งซื้อสำเร็จ<br/><span class="text-sm text-gray-500">ทางฟาร์มได้รับคำสั่งซื้อเรียบร้อยแล้ว</span>
      </p>
    </div>
  </div>

  <div id="toast-error" class="hidden fixed inset-0 flex items-center justify-center z-50 px-6">
    <div class="bg-white shadow-float-lg rounded-3xl px-8 py-6 flex flex-col items-center animate-fade-in-out">
      <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
      <p class="text-gray-800 text-base text-center">
        เกิดข้อผิดพลาด<br/><span id="toast-error-message" class="text-sm text-gray-500">กรุณาติดต่อผู้ดูแลระบบ ขออภัยในความไม่สะดวก</span>
      </p>
    </div>
  </div>

  <!-- Main Application Container -->
  <main class="min-h-screen">
    <div id="form-container">
      <div class="flex items-center justify-center py-16 animate-pulse text-gray-600">กำลังโหลดระบบ...</div>
    </div>
  </main>

  <!-- Scripts -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js?v=7"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
